name: DOTA PRO LAB — Native iOS IPA

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'tsconfig.json'
      - 'App.tsx'
      - 'index.js'
      - 'docs/github/ios-ipa.yml'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dota-pro-lab-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Validate and build signed iOS IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'

      - name: Show native toolchain
        run: |
          xcodebuild -version
          ruby --version
          pod --version
          node --version
          npm --version

      - name: Validate required Apple signing secrets before build
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          for name in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_NAME APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            echo 'Add the six Apple signing secrets documented in README.md, then re-run this workflow.'
            exit 1
          fi

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: SQLite migration check
        run: npm run test:sql

      - name: Validate React Native autolinking configuration
        run: npx react-native config > "$RUNNER_TEMP/react-native-config.json"

      - name: Generate native iOS project (Bare React Native)
        run: npm run prepare:ios

      - name: Install CocoaPods
        run: pod install --project-directory=ios

      - name: Verify generated Xcode workspace and scheme
        run: xcodebuild -list -workspace ios/DotaProLab.xcworkspace

      - name: Import Apple Distribution certificate and Ad Hoc profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/dota-pro-lab-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/dota-pro-lab.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY_OUTPUT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          if ! grep -q 'Apple Distribution:' <<< "$IDENTITY_OUTPUT"; then
            echo '::error::The imported P12 does not contain a usable Apple Distribution signing identity.'
            exit 1
          fi

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_FROM_FILE=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          EXPECTED_APP_ID="${APPLE_TEAM_ID}.com.dotaprolab.mobile"
          if [[ "$PROFILE_FROM_FILE" != "$IOS_PROVISIONING_PROFILE_NAME" ]]; then
            echo '::error::IOS_PROVISIONING_PROFILE_NAME does not match the profile file name.'
            exit 1
          fi
          if [[ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]]; then
            echo '::error::The provisioning profile belongs to a different Apple Team ID.'
            exit 1
          fi
          if [[ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]]; then
            echo "::error::The provisioning profile App ID must be $EXPECTED_APP_ID (found $PROFILE_APP_ID)."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Create Xcode export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          options = {
              'method': 'ad-hoc',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'signingStyle': 'manual',
              'provisioningProfiles': {
                  'com.dotaprolab.mobile': os.environ['IOS_PROVISIONING_PROFILE_NAME']
              },
              'stripSwiftSymbols': True,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as file:
              plistlib.dump(options, file)
          PY

      - name: Archive DOTA PRO LAB
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/DotaProLab.xcworkspace \
            -scheme DotaProLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DOTA_PRO_LAB.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER=com.dotaprolab.mobile \
            archive | tee "$RUNNER_TEMP/xcode-archive.log"

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DOTA_PRO_LAB.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH="$(find "$RUNNER_TEMP/ipa-export" -maxdepth 2 -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo '::error::Xcode export completed but no IPA file was found.'
            exit 1
          fi
          cp "$IPA_PATH" "$RUNNER_TEMP/DOTA_PRO_LAB.ipa"
          echo 'IPA export completed.'

      - name: Upload DOTA_PRO_LAB.ipa
        uses: actions/upload-artifact@v7
        with:
          name: DOTA_PRO_LAB.ipa
          path: ${{ runner.temp }}/DOTA_PRO_LAB.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Clean signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/dota-pro-lab-signing.keychain-db" 2>/dev/null || true
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/dota-pro-lab.mobileprovision" "$RUNNER_TEMP/profile.plist"
