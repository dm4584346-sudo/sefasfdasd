name: DOTA PRO LAB — iOS unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dota-pro-lab-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DOTA_PROJECT_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check build environment and required project files
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Python: $(python3 --version)"
          echo "Xcode: $(xcodebuild -version | head -n 1)"
          echo "CocoaPods: $(pod --version)"

          test -f package.json || { echo '::error::package.json is missing.'; exit 1; }
          test -f .nvmrc || { echo '::error::.nvmrc is missing.'; exit 1; }
          test -f scripts/prepare-ios-native.sh || {
            echo '::error::scripts/prepare-ios-native.sh is missing.'
            exit 1
          }

          node - <<'NODE'
          const pkg = require('./package.json');
          const scripts = pkg.scripts || {};
          for (const script of ['prepare:ios']) {
            if (!scripts[script]) {
              console.error(`Required npm script "${script}" is missing.`);
              process.exit(1);
            }
          }
          NODE

      - name: Install npm dependencies
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: TypeScript check (when configured)
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo '::warning::No typecheck script is defined; skipping optional check.'
          fi

      - name: SQLite migration check (when present)
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          if [[ -f scripts/validate-sql-migrations.py ]]; then
            python3 scripts/validate-sql-migrations.py
          else
            echo '::warning::SQL migration validator is absent; skipping optional check.'
          fi

      - name: React Native autolinking check
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          npx react-native config > "$RUNNER_TEMP/react-native-config.json"
          test -s "$RUNNER_TEMP/react-native-config.json"

      - name: Generate or validate native iOS project
        id: native
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"

          if [[ ! -d ios ]]; then
            echo 'ios/ is not committed; generating it with the repository prepare:ios script.'
            npm run prepare:ios
          else
            echo 'ios/ already exists; using the checked-out native project.'
          fi

          # Locate the generated Podfile instead of assuming a particular native folder path.
          mapfile -t PODFILE_PATHS < <(find "$DOTA_PROJECT_DIR" -maxdepth 3 -type f -name Podfile -not -path '*/node_modules/*' -print | sort)
          if [[ ${#PODFILE_PATHS[@]} -ne 1 ]]; then
            printf '::error::Expected exactly one project Podfile within three directory levels; found %s.\n' "${#PODFILE_PATHS[@]}"
            printf '%s\n' "${PODFILE_PATHS[@]}"
            exit 1
          fi

          PODFILE_PATH="${PODFILE_PATHS[0]}"
          IOS_DIR="$(dirname "$PODFILE_PATH")"
          mapfile -t XCODEPROJ_PATHS < <(find "$IOS_DIR" -maxdepth 1 -type d -name '*.xcodeproj' -print | sort)
          if [[ ${#XCODEPROJ_PATHS[@]} -ne 1 ]]; then
            printf '::error::Expected exactly one top-level .xcodeproj inside ios/, found %s.\n' "${#XCODEPROJ_PATHS[@]}"
            printf '%s\n' "${XCODEPROJ_PATHS[@]}"
            exit 1
          fi

          XCODEPROJ_PATH="${XCODEPROJ_PATHS[0]}"
          PROJECT_NAME="$(basename "$XCODEPROJ_PATH" .xcodeproj)"
          [[ -f "$XCODEPROJ_PATH/project.pbxproj" ]] || {
            echo "::error::$XCODEPROJ_PATH/project.pbxproj is missing."
            exit 1
          }

          echo "ios_dir=$IOS_DIR" >> "$GITHUB_OUTPUT"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "project_path=$XCODEPROJ_PATH" >> "$GITHUB_OUTPUT"
          echo "Detected iOS project directory: $IOS_DIR"
          echo "Detected Xcode project: $XCODEPROJ_PATH"

      - name: Install CocoaPods and discover workspace and scheme
        id: xcode
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"

          IOS_DIR="${{ steps.native.outputs.ios_dir }}"
          PROJECT_NAME="${{ steps.native.outputs.project_name }}"

          pod install --project-directory="$IOS_DIR"

          # CocoaPods normally creates <project-name>.xcworkspace. Prefer that exact
          # match; otherwise accept one unambiguous top-level workspace.
          EXPECTED_WORKSPACE="$IOS_DIR/$PROJECT_NAME.xcworkspace"
          if [[ -d "$EXPECTED_WORKSPACE" ]]; then
            WORKSPACE_PATH="$EXPECTED_WORKSPACE"
          else
            mapfile -t WORKSPACE_PATHS < <(find "$IOS_DIR" -maxdepth 1 -type d -name '*.xcworkspace' -print | sort)
            if [[ ${#WORKSPACE_PATHS[@]} -ne 1 ]]; then
              printf '::error::Could not identify one Xcode workspace in ios/. Found %s.\n' "${#WORKSPACE_PATHS[@]}"
              printf '%s\n' "${WORKSPACE_PATHS[@]}"
              exit 1
            fi
            WORKSPACE_PATH="${WORKSPACE_PATHS[0]}"
          fi

          [[ -d "$WORKSPACE_PATH" ]] || {
            echo "::error::Workspace does not exist: $WORKSPACE_PATH"
            exit 1
          }

          LIST_JSON="$RUNNER_TEMP/xcode-list.json"
          xcodebuild -list -json -workspace "$WORKSPACE_PATH" > "$LIST_JSON"

          SCHEME="$(python3 - "$LIST_JSON" "$PROJECT_NAME" <<'PY'
          import json
          import sys

          path, project_name = sys.argv[1], sys.argv[2]
          with open(path, encoding='utf-8') as handle:
              data = json.load(handle)

          workspace = data.get('workspace') or data.get('project') or {}
          schemes = workspace.get('schemes') or []
          if project_name in schemes:
              print(project_name)
          elif len(schemes) == 1:
              print(schemes[0])
          else:
              print(f'Cannot choose scheme for {project_name}. Available schemes: {schemes}', file=sys.stderr)
              sys.exit(1)
          PY
          )"

          echo "workspace=$WORKSPACE_PATH" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace: $WORKSPACE_PATH"
          echo "Using scheme: $SCHEME"

      - name: Build unsigned iOS archive
        env:
          IOS_WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          IOS_SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"

          ARCHIVE_PATH="$RUNNER_TEMP/DOTA_PRO_LAB.xcarchive"
          ARCHIVE_LOG="$RUNNER_TEMP/xcode-archive.log"

          if ! xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive 2>&1 | tee "$ARCHIVE_LOG"; then
            echo '::error::Xcode archive failed. Last 120 lines of the build log:'
            tail -n 120 "$ARCHIVE_LOG" || true
            exit 1
          fi

      - name: Package and validate unsigned IPA
        id: package
        run: |
          set -Eeuo pipefail

          APP_DIR="$RUNNER_TEMP/DOTA_PRO_LAB.xcarchive/Products/Applications"
          if [[ ! -d "$APP_DIR" ]]; then
            echo "::error::Xcode archive did not create $APP_DIR."
            exit 1
          fi

          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo '::error title=App bundle missing::Xcode did not produce an .app bundle.'
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Info.plist"
          [[ -f "$INFO_PLIST" ]] || { echo "::error::Info.plist is missing: $INFO_PLIST"; exit 1; }

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          [[ "$BUNDLE_ID" == 'com.dotaprolab.mobile' ]] || {
            echo "::error title=Bundle ID mismatch::Expected com.dotaprolab.mobile; found $BUNDLE_ID."
            exit 1
          }

          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"
          IPA_PATH="$RUNNER_TEMP/DOTA_PRO_LAB_UNSIGNED.ipa"
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/$(basename "$APP_PATH")"
          (cd "$PACKAGE_DIR" && /usr/bin/zip -qry "$IPA_PATH" Payload)

          test -s "$IPA_PATH"
          /usr/bin/unzip -tq "$IPA_PATH"
          /usr/bin/unzip -Z1 "$IPA_PATH" | grep -Eq '^Payload/[^/]+\.app/Info\.plist$' || {
            echo '::error::IPA is missing Payload/<App>.app/Info.plist.'
            exit 1
          }

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOTA_PRO_LAB_UNSIGNED_FOR_SIDELOADLY
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish IPA in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="ios-unsigned-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "$RUNNER_TEMP/DOTA_PRO_LAB_UNSIGNED.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DOTA PRO LAB iOS unsigned build #${GITHUB_RUN_NUMBER}" \
            --notes 'Unsigned IPA package. It must be signed with a valid Apple signing identity before installation.'

      - name: Write build summary
        if: success()
        run: |
          {
            echo '## DOTA PRO LAB unsigned IPA created'
            echo '- File: `DOTA_PRO_LAB_UNSIGNED.ipa`'
            echo '- Available in GitHub Actions artifacts and GitHub Releases'
            echo '- Signing: disabled during archive; sign before installing on a device'
          } >> "$GITHUB_STEP_SUMMARY"
