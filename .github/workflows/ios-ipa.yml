name: iOS unsigned IPA

on:
  workflow_dispatch:
  # при необходимости добавьте автозапуск:
  # push:
  #   branches: [ main ]

permissions:
  contents: write   # нужно для gh release create

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      DOTA_PROJECT_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          npm install

      - name: Typecheck
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          npm run typecheck

      - name: SQLite migration check
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          python3 scripts/validate-sql-migrations.py

      - name: React Native autolinking check
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          npx react-native config > "$RUNNER_TEMP/react-native-config.json"

      - name: Generate native iOS project
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          npm run prepare:ios

      - name: Install CocoaPods
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          pod install --project-directory=ios

      - name: Verify Xcode workspace and scheme
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          xcodebuild -list -workspace ios/DotaProLab.xcworkspace

      - name: Build unsigned iOS archive
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          cd "$DOTA_PROJECT_DIR"
          xcodebuild \
            -workspace ios/DotaProLab.xcworkspace \
            -scheme DotaProLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DOTA_PRO_LAB.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee "$RUNNER_TEMP/xcode-archive.log"

      - name: Package and validate unsigned IPA
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          APP_DIR="$RUNNER_TEMP/DOTA_PRO_LAB.xcarchive/Products/Applications"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "::error title=App bundle missing::Xcode did not produce an .app bundle."
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          if [[ "$BUNDLE_ID" != "com.dotaprolab.mobile" ]]; then
            echo "::error title=Bundle ID mismatch::Expected com.dotaprolab.mobile; found $BUNDLE_ID."
            exit 1
          fi

          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"
          IPA_PATH="$RUNNER_TEMP/DOTA_PRO_LAB_UNSIGNED.ipa"
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/$(basename "$APP_PATH")"
          (cd "$PACKAGE_DIR" && /usr/bin/zip -qry "$IPA_PATH" Payload)
          test -s "$IPA_PATH"
          /usr/bin/unzip -tq "$IPA_PATH"
          /usr/bin/unzip -Z1 "$IPA_PATH" | grep -Eq '^Payload/[^/]+\.app/Info\.plist$'
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOTA_PRO_LAB_UNSIGNED_FOR_SIDELOADLY
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish IPA in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="ios-unsigned-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "$RUNNER_TEMP/DOTA_PRO_LAB_UNSIGNED.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DOTA PRO LAB iOS build #${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned IPA for Sideloadly. Sideloadly signs the application before installation. The source ZIP remains in the repository."

      - name: Write build summary
        if: success()
        run: |
          {
            echo '## DOTA PRO LAB IPA created'
            echo '- File: `DOTA_PRO_LAB_UNSIGNED.ipa`'
            echo '- Available in GitHub Actions artifacts and GitHub Releases'
            echo '- Original source ZIP remains in the repository'
            echo '- No Expo, EAS or Apple signing secrets were used'
          } >> "$GITHUB_STEP_SUMMARY"
