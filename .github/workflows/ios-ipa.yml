name: iOS unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      DOTA_PROJECT_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'      # <--- Исправлено: явно задаём версию
          cache: 'npm'

      - name: Install npm dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          npm install             # <--- Оставляем npm install, так как нет lock-файла

      - name: Typecheck
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          npm run typecheck

      # ... остальные шаги без изменений ...
