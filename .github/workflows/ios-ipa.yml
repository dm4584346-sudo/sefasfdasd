
      - name: Install CocoaPods
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          pod install --project-directory=ios

      - name: Verify Xcode workspace and scheme
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          test -d ios/DotaProLab.xcworkspace || {
            echo '::error::ios/DotaProLab.xcworkspace was not created by CocoaPods.'
            exit 1
          }
          xcodebuild -list -workspace ios/DotaProLab.xcworkspace

      - name: Build unsigned iOS archive
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"

          ARCHIVE_PATH="$RUNNER_TEMP/DOTA_PRO_LAB.xcarchive"
          ARCHIVE_LOG="$RUNNER_TEMP/xcode-archive.log"

          if ! xcodebuild \
            -workspace ios/DotaProLab.xcworkspace \
            -scheme DotaProLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive 2>&1 | tee "$ARCHIVE_LOG"; then
            echo '::error::Xcode archive failed. Last 100 lines of the build log:'
            tail -n 100 "$ARCHIVE_LOG" || true
            exit 1
          fi

      - name: Package and validate unsigned IPA
        id: package
        run: |
          set -Eeuo pipefail

          APP_DIR="$RUNNER_TEMP/DOTA_PRO_LAB.xcarchive/Products/Applications"
          if [[ ! -d "$APP_DIR" ]]; then
            echo "::error::Xcode archive did not create $APP_DIR."
            exit 1
          fi

          # Do not escape the wildcard: find must match a real *.app directory.
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo '::error title=App bundle missing::Xcode did not produce an .app bundle.'
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Info.plist"
          if [[ ! -f "$INFO_PLIST" ]]; then
            echo "::error::Info.plist is missing from $APP_PATH."
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          if [[ "$BUNDLE_ID" != 'com.dotaprolab.mobile' ]]; then
            echo "::error title=Bundle ID mismatch::Expected com.dotaprolab.mobile; found $BUNDLE_ID."
            exit 1
          fi

          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"
          IPA_PATH="$RUNNER_TEMP/DOTA_PRO_LAB_UNSIGNED.ipa"
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/$(basename "$APP_PATH")"
          (cd "$PACKAGE_DIR" && /usr/bin/zip -qry "$IPA_PATH" Payload)

          test -s "$IPA_PATH"
          /usr/bin/unzip -tq "$IPA_PATH"

          # In grep -E, a single backslash escapes the literal dot.
          if ! /usr/bin/unzip -Z1 "$IPA_PATH" | grep -Eq '^Payload/[^/]+\.app/Info\.plist$'; then
            echo '::error::The IPA archive does not contain Payload/<App>.app/Info.plist.'
            exit 1
          fi

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOTA_PRO_LAB_UNSIGNED_FOR_SIDELOADLY
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish IPA in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="ios-unsigned-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" \
            "$RUNNER_TEMP/DOTA_PRO_LAB_UNSIGNED.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DOTA PRO LAB iOS unsigned build #${GITHUB_RUN_NUMBER}" \
            --notes 'Unsigned IPA package. It must be signed with a valid Apple signing identity before installation.'

      - name: Write build summary
        if: success()
        run: |
          {
            echo '## DOTA PRO LAB unsigned IPA created'
            echo '- File: `DOTA_PRO_LAB_UNSIGNED.ipa`'
            echo '- Available in GitHub Actions artifacts and GitHub Releases'
            echo '- Signing: disabled during archive; sign before installing on a device'
          } >> "$GITHUB_STEP_SUMMARY"
