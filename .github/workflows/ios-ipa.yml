name: DOTA PRO LAB — iOS unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dota-pro-lab-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DOTA_PROJECT_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check build environment and project scripts
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Python: $(python3 --version)"
          echo "Xcode: $(xcodebuild -version | head -n 1)"
          echo "Ruby: $(ruby --version)"
          echo "CocoaPods: $(pod --version)"

          test -f package.json || { echo '::error::package.json is missing.'; exit 1; }
          test -f scripts/prepare-ios-native.sh || {
            echo '::error::scripts/prepare-ios-native.sh is missing.'
            exit 1
          }

          node - <<'NODE'
          const pkg = require('./package.json');
          const expectedNode = '22.13.1';
          const actualNode = process.versions.node;
          const scripts = pkg.scripts || {};

          if (!scripts['prepare:ios']) {
            console.error('Required npm script "prepare:ios" is missing.');
            process.exit(1);
          }

          const [major, minor, patch] = actualNode.split('.').map(Number);
          const [requiredMajor, requiredMinor, requiredPatch] = expectedNode.split('.').map(Number);
          const isTooOld = major < requiredMajor ||
            (major === requiredMajor && minor < requiredMinor) ||
            (major === requiredMajor && minor === requiredMinor && patch < requiredPatch);

          if (isTooOld) {
            console.error(`Node ${actualNode} is too old; use ${expectedNode} or newer in the Node 22 line.`);
            process.exit(1);
          }
          NODE

      - name: Install npm dependencies
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: TypeScript check (when configured)
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"

          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo '::warning::No typecheck script is defined; skipping this optional check.'
          fi

      - name: SQLite migration check (when present)
        run: |
          set -Eeuo pipefail
          cd "$DOTA_PROJECT_DIR"

          if [[ -f scripts/validate-sql-migrations.py ]]; then
